services:
  # Backend NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reboulstore-backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/logs:/app/logs
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - LOG_DIR=/app/logs
      # Configuration DB : Base de données UNIQUEMENT sur le VPS (via tunnel SSH)
      # Les variables sont chargées depuis ./backend/.env
      # DB_HOST doit être host.docker.internal (tunnel SSH) ou l'IP du VPS
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - PORT=3001
      # Configuration Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AS400_SORTANT_DIR=${AS400_SORTANT_DIR:-/tmp/as400-sortant}
      - AS400_EXPORT_FILENAME=${AS400_EXPORT_FILENAME:-produits_reboul.csv}
      - AS400_EXPORT_SECRET=${AS400_EXPORT_SECRET:-}
    depends_on:
      - redis
    networks:
      - reboulstore-network
    # Permettre l'accès à host.docker.internal pour le tunnel SSH (DB distante)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Installation automatique des dépendances puis démarrage
    command: >
      sh -c "
        echo '📦 Installation des dépendances backend...' &&
        npm install --legacy-peer-deps &&
        echo '✅ Dépendances installées' &&
        npm run start:dev
      "
    logging:
      driver: "json-file"
      options:
        tag: "{{.Name}}/backend"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: reboulstore-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - reboulstore-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Frontend React + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reboulstore-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - backend
    networks:
      - reboulstore-network
    # Installation automatique des dépendances puis démarrage
    command: >
      sh -c "
        echo '📦 Installation des dépendances frontend...' &&
        npm install --legacy-peer-deps &&
        echo '✅ Dépendances installées' &&
        npm run dev
      "

volumes:
  redis_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  reboulstore-network:
    name: reboulstore-network  # Nom explicite pour partage avec admin-central
    driver: bridge

